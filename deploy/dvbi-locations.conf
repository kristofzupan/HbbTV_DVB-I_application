# Location blocks shared by every listener serving the DVB-I client: plain HTTP
# on 9080 and, once a certificate exists, HTTPS on 443. Kept in one file so the
# two cannot drift apart — a rule that applies on one port and not the other is
# the kind of difference that only shows up on a TV, days later.
#
# Install:
#   sudo cp deploy/dvbi-locations.conf /etc/nginx/snippets/dvbi-locations.conf
#
# Included as `include snippets/dvbi-locations.conf;` from within a server block
# that has already set `root` and `index`.

# The service list editor and the endpoints it drives. Those endpoints create
# and delete service lists with no authentication of their own, so nginx
# supplies it. Read paths stay open: DVB-I clients need them.
#
# Create the password file once:
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-dvbi <username>
location = /backend/index.html {
    auth_basic "DVB-I service list editor";
    auth_basic_user_file /etc/nginx/.htpasswd-dvbi;
}

location ~ ^/backend/(upload_servicelist|delete_servicelist)\.php$ {
    auth_basic "DVB-I service list editor";
    auth_basic_user_file /etc/nginx/.htpasswd-dvbi;
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

# The user-test control page. The server blocks name index.html as the index,
# so /test/ would otherwise find no page and answer 403; the PHP development
# server picks index.php by itself, which is why this only shows on a host.
location = /test/ {
    rewrite ^ /test/index.php last;
}

# Live segments roll over every few seconds; caching them breaks playback.
location /stream/live/ {
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# Application and client sources carry no version in their URLs, so a cached
# copy survives a deploy and presents as a deploy that silently did nothing —
# the same symptom as a broken one, and far harder to recognise. Revalidate
# instead: no-cache still allows a 304, so this costs a conditional request,
# not a re-download.
location ~* ^/(hbbtv-app|frontend|backend)/.*\.(js|html|css|json|xml)$ {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ =404;
    add_header Access-Control-Allow-Origin "*" always;
}

location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
