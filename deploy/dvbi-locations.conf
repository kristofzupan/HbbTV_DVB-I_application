location = /backend/index.html {
    auth_basic "DVB-I service list editor";
    auth_basic_user_file /etc/nginx/.htpasswd-dvbi;
}

location ~ ^/backend/(upload_servicelist|delete_servicelist)\.php$ {
    auth_basic "DVB-I service list editor";
    auth_basic_user_file /etc/nginx/.htpasswd-dvbi;
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

location = /test/ {
    rewrite ^ /test/index.php last;
}

location /stream/live/ {
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
}

location ~* ^/(hbbtv-app|frontend|backend)/.*\.(js|html|css|json|xml)$ {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
}

location = /UEQ {
    return 301 /UEQ/;
}

location ^~ /UEQ/ {
    alias /srv/dvbi/HbbTV_DVB-I_application/UEQ/;
    index index.php index.html;
    add_header Cache-Control "no-cache" always;

    # database holds participant answers, never serve it
    location ~ ^/UEQ/(\.|database/|extras/database\.php$) {
        return 404;
    }

    location ~ ^/UEQ/(exportResponses|exportLogData|pregled)\.php$ {
        auth_basic "UEQ results";
        auth_basic_user_file /etc/nginx/.htpasswd-dvbi;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}

location / {
    try_files $uri $uri/ =404;
    add_header Access-Control-Allow-Origin "*" always;
}

location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
