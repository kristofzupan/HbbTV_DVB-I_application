server {
    # no http2 until nginx is patched for CVE-2026-123007
    listen 443 ssl;
    server_name dvb-i.lmmfe.org;

    ssl_certificate     /etc/letsencrypt/live/dvb-i.lmmfe.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dvb-i.lmmfe.org/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /srv/dvbi/HbbTV_DVB-I_application/DVB-I-Reference-Client;
    index index.html;

    include snippets/dvbi-locations.conf;
}
