# HTTPS listener for the DVB-I service. Installed by deploy/enable-tls, and only
# after a certificate exists: nginx refuses to start when ssl_certificate points
# at a missing file, which would take the whole site down rather than just this
# listener.
#
# Install (deploy/enable-tls does this for you):
#   sudo cp deploy/nginx-dvbi-tls.conf /etc/nginx/sites-available/dvbi-tls
#   sudo ln -sf /etc/nginx/sites-available/dvbi-tls /etc/nginx/sites-enabled/dvbi-tls
#   sudo nginx -t && sudo systemctl reload nginx

server {
    # http2 is written as a listen parameter because Ubuntu 24.04 ships nginx
    # 1.24; the separate `http2 on;` directive only exists from 1.25.1.
    listen 443 ssl http2;
    server_name dvb-i.lmmfe.org;

    ssl_certificate     /etc/letsencrypt/live/dvb-i.lmmfe.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dvb-i.lmmfe.org/privkey.pem;

    # TLS 1.2 is kept alongside 1.3: HbbTV 2.0.x terminals are required to
    # support 1.2, and many support nothing newer. Dropping it here would lock
    # out the devices this service exists for.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /srv/dvbi/HbbTV_DVB-I_application/DVB-I-Reference-Client;
    index index.html;

    include snippets/dvbi-locations.conf;
}
