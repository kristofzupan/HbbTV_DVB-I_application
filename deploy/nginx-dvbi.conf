# nginx site for the DVB-I reference client and the interpreter overlay app.
#
# Install:
#   sudo cp deploy/nginx-dvbi.conf /etc/nginx/sites-available/dvbi
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/dvbi /etc/nginx/sites-enabled/dvbi
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires two entries in /etc/nginx/mime.types, without which TVs reject the
# stream:
#   application/dash+xml   mpd;
#   video/iso.segment      m4s;

server {
    listen 9080 default_server;
    server_name _;

    root /srv/dvbi/HbbTV_DVB-I_application/DVB-I-Reference-Client;
    index index.html;

    # The service list editor and the endpoints it drives. Those endpoints create
    # and delete service lists with no authentication of their own, so nginx
    # supplies it. Read paths stay open: DVB-I clients need them.
    #
    # Create the password file once:
    #   sudo apt install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd-dvbi <username>
    location = /backend/index.html {
        auth_basic "DVB-I service list editor";
        auth_basic_user_file /etc/nginx/.htpasswd-dvbi;
    }

    location ~ ^/backend/(upload_servicelist|delete_servicelist)\.php$ {
        auth_basic "DVB-I service list editor";
        auth_basic_user_file /etc/nginx/.htpasswd-dvbi;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Live segments roll over every few seconds; caching them breaks playback.
    location /stream/live/ {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
