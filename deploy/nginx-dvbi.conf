# nginx site for the DVB-I reference client and the interpreter overlay app.
#
# Install:
#   sudo cp deploy/dvbi-locations.conf /etc/nginx/snippets/dvbi-locations.conf
#   sudo cp deploy/nginx-dvbi.conf /etc/nginx/sites-available/dvbi
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/dvbi /etc/nginx/sites-enabled/dvbi
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires two entries in /etc/nginx/mime.types, without which TVs reject the
# stream:
#   application/dash+xml   mpd;
#   video/iso.segment      m4s;
#
# TLS on 443 lives in deploy/nginx-dvbi-tls.conf, installed separately by
# deploy/enable-tls once a certificate exists — nginx refuses to start with an
# ssl_certificate that is not there yet, so the two cannot be one file.

# Plain HTTP on the original port. Kept after TLS is enabled: it is the fallback
# for terminals whose trust store predates ISRG Root X1 and so cannot complete a
# Let's Encrypt handshake at all.
server {
    listen 9080 default_server;
    server_name dvb-i.lmmfe.org _;

    root /srv/dvbi/HbbTV_DVB-I_application/DVB-I-Reference-Client;
    index index.html;

    include snippets/dvbi-locations.conf;
}

# Port 80 exists for ACME. Let's Encrypt validates over 80 or 443 and nowhere
# else — it cannot be pointed at 9080 — and it revalidates on every renewal, so
# this listener has to stay reachable, not just be opened once.
server {
    listen 80;
    server_name dvb-i.lmmfe.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
