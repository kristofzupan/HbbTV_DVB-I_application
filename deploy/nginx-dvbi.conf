# nginx site for the DVB-I reference client and the interpreter overlay app.
#
# Install:
#   sudo cp deploy/nginx-dvbi.conf /etc/nginx/sites-available/dvbi
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/dvbi /etc/nginx/sites-enabled/dvbi
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires two entries in /etc/nginx/mime.types, without which TVs reject the
# stream:
#   application/dash+xml   mpd;
#   video/iso.segment      m4s;

server {
    listen 9080 default_server;
    server_name _;

    root /srv/dvbi/HbbTV_DVB-I_application/DVB-I-Reference-Client;
    index index.html;

    # The reference client can create and delete service lists over HTTP with no
    # authentication of any kind. Nothing at runtime needs them, since the
    # service list is deployed from git, so they are refused here rather than
    # left to depend on the firewall.
    location ~ ^/backend/(upload_servicelist|delete_servicelist)\.php$ { deny all; }
    location = /backend/index.html { deny all; }

    # Live segments roll over every few seconds; caching them breaks playback.
    location /stream/live/ {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
