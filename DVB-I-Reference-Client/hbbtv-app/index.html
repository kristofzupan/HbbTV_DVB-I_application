<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Laid out at 960 px wide and scaled to the screen by the television, as
       the DVB-I client is (frontend/android/player.html explains why). Matters
       where this page is loaded directly, as the Tizen app does via
       wrapper.html; inside the client's frame a viewport tag has no effect, and
       the client's own scaling covers it. -->
  <meta name="viewport" content="width=960, user-scalable=no">
<title>DVB-I Accessibility</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    window.onerror = function (msg, src, line) {
      var el = document.getElementById('dvbi-boot-status');
      if (el) {
        el.style.background = '#8b0000';
        el.style.display = 'block';
        el.innerHTML = '<b>Error:</b> ' + msg + ' (' + (src || '?').replace(/.*\//, '') + ':' + line + ')';
      }
      return false;
    };
  </script>
</head>
<body>
  <div id="dvbi-boot-status">Nalaganje aplikacije za dostopnost DVB-I ...</div>

  <!-- HbbTV terminal objects. Instantiated by the terminal only; inert in a
       browser, where they behave as empty elements.

       As a linked application of type 1.1 the terminal, not this application,
       presents the main picture. Holding a video/broadcast object bound to the
       current channel is what keeps that presentation alive: an application that
       starts its own broadband video without one causes the terminal to suspend
       the channel (ETSI TS 102 796 clause A.2.1) — blacking out the programme
       this overlay exists to accompany.
       
       Both start with no area and hidden: a browser has no handler for these
       types and would otherwise draw a "plugin not supported" box over the
       page. hbbtv-bridge gives the broadcast object the full screen only once a
       terminal has accepted bindToCurrentChannel. -->
  <object id="appManager" type="application/oipfApplicationManager"
          style="position:absolute;left:0;top:0;width:0;height:0;visibility:hidden"></object>
  <object id="broadcastVideo" type="video/broadcast"
          style="position:absolute;left:0;top:0;width:0;height:0;visibility:hidden"></object>

  <!-- Main video: fullscreen background. Used when the app is responsible for
       playback (browser, or launched with ?main=); unused once bound to a
       terminal's own presentation. -->
  <video id="mainVideo" playsinline muted></video>

  <!-- Interpreter overlay: visible by default, top-right — the bottom of the
       screen is where subtitles are rendered. Must match posRow/posCol in
       app.js, which is what every later repositioning is applied from. -->
  <div id="interpreterOverlay" class="interpreter-overlay interpreter-position-br">
    <video id="interpreterVideo" playsinline muted></video>
    <canvas id="interpreterCanvas" width="960" height="720"></canvas>
  </div>

  <!-- Subtitles, drawn by this application. Positioned to match the region the
       EBU-TT-D document declares (subtitles/main_slv.xml): the title-safe area,
       text pinned to its bottom edge. Kept in the conventional place — it is
       the interpreter overlay that moved to the top right to make room. -->
  <div id="subtitles"></div>

  <!-- Grey around the shrunken main picture in the split views (BLUE). Two
       strips, right of and below the picture, so nothing paints over it. -->
  <div id="greyRight" class="grey-frame"></div>
  <div id="greyBottom" class="grey-frame"></div>

  <div id="toast"></div>

  <!-- Persistent hint bar -->
  <!-- Colour keys as drawn squares, not emoji: a TV browser often has no emoji
       font and would show an empty box. Order follows the remote. -->
  <div id="hintBar"><span class="key key-red"></span> = vklop/izklop<span id="hintSignerKeys"> &nbsp;|&nbsp; &#9664;&#9654;&#9650;&#9660; = premik &nbsp;|&nbsp; <span class="key key-green"></span> = pomanjšaj &nbsp;|&nbsp; <span class="key key-yellow"></span> = povečaj &nbsp;|&nbsp; <span class="key key-blue"></span> = pogled</span> &nbsp;|&nbsp; TEXT = podnapisi</div>

  <!-- Error display -->
  <div id="errorOverlay"></div>

  <script src="js/hbbtv-bridge.js"></script>
  <script src="js/dash.all.min.js"></script>
  <script src="js/broadway-decoder.js"></script>
  <script src="js/broadway-yuvcanvas.js"></script>
  <script src="js/broadway-player-lib.js"></script>
  <script src="js/wasm-decoder.js"></script>
  <script src="js/webcodecs-decoder.js"></script>
  <!-- Before app.js, which logs to it. Hosted by the DVB-I client it defers to
       the client's instance; run directly on a terminal it does the job itself. -->
  <script src="js/test-session.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
