<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<title>DVB-I Accessibility</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    window.onerror = function (msg, src, line) {
      var el = document.getElementById('dvbi-boot-status');
      if (el) {
        el.style.background = '#8b0000';
        el.style.display = 'block';
        el.innerHTML = '<b>Error:</b> ' + msg + ' (' + (src || '?').replace(/.*\//, '') + ':' + line + ')';
      }
      return false;
    };
  </script>
</head>
<body>
  <div id="dvbi-boot-status">Loading DVB-I accessibility app...</div>

  <!-- Main video: fullscreen background -->
  <video id="mainVideo" playsinline muted>
    <track id="subtitleTrack" kind="subtitles" src="subtitles/sample.vtt" srclang="en" label="English" default>
  </video>

  <!-- Interpreter overlay: visible by default, bottom-right -->
  <div id="interpreterOverlay" class="interpreter-overlay interpreter-position-br">
    <video id="interpreterVideo" playsinline muted></video>
    <canvas id="interpreterCanvas" width="960" height="720"></canvas>
  </div>

  <div id="toast"></div>

  <!-- Persistent hint bar -->
  <div id="hintBar">RED=on/off &nbsp;|&nbsp; &#9664;&#9654;=move &nbsp;|&nbsp; &#9650;&#9660;=row &nbsp;|&nbsp; GREEN=bigger &nbsp;|&nbsp; YELLOW=smaller &nbsp;|&nbsp; BLUE=reset</div>

  <!-- Error display -->
  <div id="errorOverlay"></div>

  <script src="js/hbbtv-bridge.js"></script>
  <script src="js/dash.all.min.js"></script>
  <script src="js/broadway-decoder.js"></script>
  <script src="js/broadway-yuvcanvas.js"></script>
  <script src="js/broadway-player-lib.js"></script>
  <script src="js/wasm-decoder.js"></script>
  <script src="js/webcodecs-decoder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
